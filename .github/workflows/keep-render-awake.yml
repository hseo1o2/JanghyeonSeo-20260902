name: Keep Render awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 45 https://daily-first-server.onrender.com/api/health
